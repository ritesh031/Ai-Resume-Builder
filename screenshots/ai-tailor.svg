<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="1200" height="760" fill="#f9fafb"/>
  <!-- Navbar -->
  <rect width="1200" height="58" fill="white"/>
  <line x1="0" y1="58" x2="1200" y2="58" stroke="#e5e7eb" stroke-width="1"/>
  <text x="40" y="35" font-size="16" font-weight="700" fill="#6366f1">✦ AI Resume Builder</text>
  <text x="390" y="35" font-size="13" fill="#6b7280">Dashboard</text>
  <rect x="460" y="16" width="80" height="28" rx="7" fill="#eef2ff"/>
  <text x="500" y="35" font-size="13" font-weight="600" fill="#4f46e5" text-anchor="middle">Resume</text>
  <text x="590" y="35" font-size="13" fill="#6b7280">Job Tracker</text>
  <text x="690" y="35" font-size="13" fill="#6b7280">AI Versions</text>
  <text x="1080" y="35" font-size="13" fill="#6b7280">Hi, <tspan font-weight="600" fill="#374151">Ritesh</tspan>  Logout</text>

  <!-- Input card -->
  <rect x="40" y="75" width="1115" height="220" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="65" y="108" font-size="15" font-weight="600" fill="#374151">✨ AI Resume Tailor</text>
  <text x="65" y="130" font-size="12" fill="#6b7280">Paste a job description below. AI will rewrite your resume to match keywords and give you an ATS score.</text>

  <text x="65" y="158" font-size="12" font-weight="500" fill="#374151">Job Title</text>
  <rect x="65" y="165" width="520" height="36" rx="8" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <text x="82" y="187" font-size="13" fill="#374151">Frontend Developer</text>

  <text x="620" y="158" font-size="12" font-weight="500" fill="#374151">Company Name</text>
  <rect x="620" y="165" width="510" height="36" rx="8" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <text x="637" y="187" font-size="13" fill="#374151">Razorpay</text>

  <text x="65" y="218" font-size="12" font-weight="500" fill="#374151">Job Description *</text>
  <rect x="65" y="226" width="1065" height="48" rx="8" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <text x="82" y="245" font-size="12" fill="#6b7280">We are looking for a skilled Frontend Developer with strong React.js experience, proficiency in REST APIs...</text>

  <rect x="65" y="283" width="220" height="38" rx="9" fill="#6366f1"/>
  <text x="175" y="306" font-size="13" font-weight="500" fill="white" text-anchor="middle">⚡ Tailor My Resume with AI</text>

  <!-- Result card -->
  <rect x="40" y="312" width="1115" height="430" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Header row -->
  <text x="65" y="348" font-size="14" font-weight="600" fill="#374151">✅ AI Tailored for: Frontend Developer at Razorpay</text>
  <text x="65" y="368" font-size="12" fill="#6b7280">Saved to your AI Versions. Use this content when applying.</text>

  <!-- ATS Ring -->
  <circle cx="1080" cy="370" r="50" fill="none" stroke="#e5e7eb" stroke-width="10"/>
  <circle cx="1080" cy="370" r="50" fill="none" stroke="#22c55e" stroke-width="10" stroke-dasharray="257 314" stroke-linecap="round" transform="rotate(-90 1080 370)"/>
  <text x="1080" y="366" font-size="20" font-weight="700" fill="#22c55e" text-anchor="middle">82</text>
  <text x="1080" y="382" font-size="11" fill="#6b7280" text-anchor="middle">ATS Score</text>
  <text x="1080" y="432" font-size="12" font-weight="600" fill="#22c55e" text-anchor="middle">Great match!</text>

  <!-- Improvements -->
  <rect x="65" y="385" width="960" height="90" rx="9" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="88" y="408" font-size="12" font-weight="600" fill="#15803d">✅ What AI improved:</text>
  <text x="88" y="428" font-size="12" fill="#166534">•  Added React.js and Redux keywords from JD naturally into summary and experience</text>
  <text x="88" y="448" font-size="12" fill="#166534">•  Quantified achievements: "Improved load time by 35%" and "Reduced API calls by 40%"</text>
  <text x="88" y="465" font-size="12" fill="#166534">•  Rewrote summary to target Razorpay's fintech domain</text>

  <!-- Skills -->
  <text x="65" y="500" font-size="13" font-weight="600" fill="#374151">🛠 Matched Skills</text>
  <rect x="65" y="510" width="75" height="26" rx="13" fill="#eef2ff"/>
  <text x="102" y="527" font-size="11" font-weight="500" fill="#4f46e5" text-anchor="middle">React.js</text>
  <rect x="150" y="510" width="65" height="26" rx="13" fill="#eef2ff"/>
  <text x="182" y="527" font-size="11" font-weight="500" fill="#4f46e5" text-anchor="middle">Redux</text>
  <rect x="225" y="510" width="85" height="26" rx="13" fill="#eef2ff"/>
  <text x="267" y="527" font-size="11" font-weight="500" fill="#4f46e5" text-anchor="middle">REST APIs</text>
  <rect x="320" y="510" width="100" height="26" rx="13" fill="#eef2ff"/>
  <text x="370" y="527" font-size="11" font-weight="500" fill="#4f46e5" text-anchor="middle">JavaScript</text>
  <rect x="430" y="510" width="75" height="26" rx="13" fill="#eef2ff"/>
  <text x="467" y="527" font-size="11" font-weight="500" fill="#4f46e5" text-anchor="middle">Node.js</text>
  <rect x="515" y="510" width="85" height="26" rx="13" fill="#eef2ff"/>
  <text x="557" y="527" font-size="11" font-weight="500" fill="#4f46e5" text-anchor="middle">MongoDB</text>
  <rect x="610" y="510" width="45" height="26" rx="13" fill="#eef2ff"/>
  <text x="632" y="527" font-size="11" font-weight="500" fill="#4f46e5" text-anchor="middle">Git</text>

  <!-- Tailored Summary -->
  <text x="65" y="565" font-size="13" font-weight="600" fill="#374151">📝 Tailored Summary</text>
  <rect x="65" y="573" width="1065" height="80" rx="9" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="82" y="596" font-size="12" fill="#374151">Results-driven CSE graduate with strong proficiency in React.js, Redux, and REST API integration. Built production-grade</text>
  <text x="82" y="616" font-size="12" fill="#374151">projects including an AI-powered resume builder that improved user engagement by 40%. Eager to contribute to Razorpay's</text>
  <text x="82" y="636" font-size="12" fill="#374151">fintech mission through performant, scalable frontend solutions.</text>

  <text x="65" y="715" font-size="11" fill="#9ca3af">💾 This version is saved under "AI Versions" tab. You can view all versions there.</text>
</svg>
