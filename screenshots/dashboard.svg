<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="1200" height="700" fill="#f9fafb"/>
  <!-- Navbar -->
  <rect width="1200" height="58" fill="white"/>
  <line x1="0" y1="58" x2="1200" y2="58" stroke="#e5e7eb" stroke-width="1"/>
  <!-- Logo -->
  <text x="40" y="35" font-size="16" font-weight="700" fill="#6366f1">✦ AI Resume Builder</text>
  <!-- Nav links -->
  <rect x="340" y="16" width="100" height="28" rx="7" fill="#eef2ff"/>
  <text x="390" y="35" font-size="13" font-weight="600" fill="#4f46e5" text-anchor="middle">Dashboard</text>
  <text x="490" y="35" font-size="13" fill="#6b7280">Resume</text>
  <text x="580" y="35" font-size="13" fill="#6b7280">Job Tracker</text>
  <text x="680" y="35" font-size="13" fill="#6b7280">AI Versions</text>
  <!-- User -->
  <text x="1080" y="35" font-size="13" fill="#6b7280">Hi, <tspan font-weight="600" fill="#374151">Ritesh</tspan>  Logout</text>

  <!-- Page content -->
  <text x="40" y="100" font-size="26" font-weight="700" fill="#111827">Welcome back, Ritesh 👋</text>
  <text x="40" y="128" font-size="14" fill="#6b7280">Here's your job search at a glance.</text>

  <!-- Stat cards -->
  <!-- Card 1 -->
  <rect x="40" y="155" width="355" height="90" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="65" y="177" width="46" height="46" rx="10" fill="#eef2ff"/>
  <text x="88" y="207" font-size="22" text-anchor="middle">💼</text>
  <text x="128" y="196" font-size="12" fill="#6b7280">Total Applications</text>
  <text x="128" y="224" font-size="32" font-weight="700" fill="#111827">12</text>
  <!-- Card 2 -->
  <rect x="420" y="155" width="355" height="90" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="445" y="177" width="46" height="46" rx="10" fill="#f0fdf4"/>
  <text x="468" y="207" font-size="22" text-anchor="middle">📈</text>
  <text x="508" y="196" font-size="12" fill="#6b7280">Interviews</text>
  <text x="508" y="224" font-size="32" font-weight="700" fill="#111827">3</text>
  <!-- Card 3 -->
  <rect x="800" y="155" width="355" height="90" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="825" y="177" width="46" height="46" rx="10" fill="#fffbeb"/>
  <text x="848" y="207" font-size="22" text-anchor="middle">✨</text>
  <text x="888" y="196" font-size="12" fill="#6b7280">AI Tailored Resumes</text>
  <text x="888" y="224" font-size="32" font-weight="700" fill="#111827">7</text>

  <!-- Quick Actions card -->
  <rect x="40" y="268" width="555" height="220" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="65" y="302" font-size="14" font-weight="600" fill="#374151">✨ Quick Actions</text>
  <!-- Btn 1 -->
  <rect x="65" y="316" width="505" height="46" rx="9" fill="#eef2ff"/>
  <text x="90" y="344" font-size="13" font-weight="500" fill="#4f46e5">📄  Build / Edit My Resume</text>
  <text x="545" y="344" font-size="14" fill="#4f46e5" text-anchor="end">→</text>
  <!-- Btn 2 -->
  <rect x="65" y="373" width="505" height="46" rx="9" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="90" y="401" font-size="13" fill="#374151">➕  Add New Job Application</text>
  <text x="545" y="401" font-size="14" fill="#6b7280" text-anchor="end">→</text>
  <!-- Btn 3 -->
  <rect x="65" y="430" width="505" height="46" rx="9" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="90" y="458" font-size="13" fill="#374151">✨  View AI Tailored Versions</text>
  <text x="545" y="458" font-size="14" fill="#6b7280" text-anchor="end">→</text>

  <!-- Recent Applications card -->
  <rect x="620" y="268" width="535" height="220" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="645" y="302" font-size="14" font-weight="600" fill="#374151">💼 Recent Applications</text>
  <!-- Job rows -->
  <text x="645" y="336" font-size="13" font-weight="500" fill="#111827">Frontend Developer</text>
  <text x="645" y="354" font-size="11" fill="#6b7280">Razorpay</text>
  <rect x="1060" y="322" width="72" height="22" rx="11" fill="#fffbeb"/>
  <text x="1096" y="337" font-size="11" font-weight="500" fill="#d97706" text-anchor="middle">Interview</text>
  <line x1="645" y1="365" x2="1135" y2="365" stroke="#f3f4f6" stroke-width="1"/>

  <text x="645" y="392" font-size="13" font-weight="500" fill="#111827">React Developer</text>
  <text x="645" y="410" font-size="11" fill="#6b7280">Swiggy</text>
  <rect x="1070" y="378" width="65" height="22" rx="11" fill="#eef2ff"/>
  <text x="1102" y="393" font-size="11" font-weight="500" fill="#4f46e5" text-anchor="middle">Applied</text>
  <line x1="645" y1="421" x2="1135" y2="421" stroke="#f3f4f6" stroke-width="1"/>

  <text x="645" y="448" font-size="13" font-weight="500" fill="#111827">UI Developer</text>
  <text x="645" y="466" font-size="11" fill="#6b7280">Flipkart</text>
  <rect x="1072" y="434" width="63" height="22" rx="11" fill="#f0fdf4"/>
  <text x="1103" y="449" font-size="11" font-weight="500" fill="#16a34a" text-anchor="middle">Offer</text>

  <!-- Offer banner -->
  <rect x="40" y="510" width="1115" height="56" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="70" y="545" font-size="22">🎉</text>
  <text x="105" y="545" font-size="14" font-weight="600" fill="#15803d">You have 1 job offer! Congratulations!</text>
</svg>
